<!DOCTYPE html>
<html>

<head>
	<link rel="icon" type="image/png" href="https://avatars1.githubusercontent.com/u/12843654?s=32&v=4">
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta name="robots" content="noindex, nofollow">
	<meta name="googlebot" content="noindex, nofollow">
	<style type="text/css">
		body {
			background: #F0F0F0;
			font-family: 'Segoe UI', sans-serif;
		}

		.textarea {
			padding: 5px;
			font-size: 16px;
			border-width: 1px;
			border-color: #CCCCCC;
			background-color: #FFFFFF;
			background: none repeat scroll 0 0 rgba(0, 0, 0, 0.07);
			color: #000000;
			border-style: solid;
			border-radius: 3px;
			box-shadow: 0px 0px 5px rgba(66, 66, 66, .75);
			text-align: center;
			line-height: 1.4em;
		}

		.textarea:focus {
			background: none repeat scroll 0 0 #FFFFFF;
			display: inline;
			outline-width: 0;
		}

		.h1 {
			color: #235ebc;
			font-family: 'Segoe UI', serif;
			font-size: 45px;
			font-weight: normal;
			line-height: 48px;
			margin: 0 0 5px;
			text-align: center;
		}

		.p {
			color: #4c4a37;
			font-size: 18px;
			line-height: 32px;
			margin: auto;
			text-align: center;
			font-weight: bold;
		}

		.wrapper {
			text-align: center;
			margin-top: 10px;
		}

		.btn {
			background-color: #555555;
			border: none;
			border-radius: 5px;
			color: white;
			padding: 10px 20px;
			text-align: center;
			text-decoration: none;
			display: inline-block;
			font-size: 16px;
			cursor: pointer;
		}

		.btn:hover {
			background: #201d7a;
		}

		#multi {
			margin-top: 20px;
		}

		#multi img {
			margin: 15px;
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
			border-radius: 4px;
			max-width: 648px;
			height: auto;
		}

		.auth-warning {
			background-color: #ffdde1;
			border: 1px solid #ff4a5a;
			color: #bd1f2d;
			padding: 12px;
			border-radius: 5px;
			margin: 15px auto;
			max-width: 640px;
			text-align: center;
			font-size: 14px;
			font-weight: bold;
		}

		.auth-warning a {
			color: #235ebc;
			text-decoration: underline;
		}
	</style>

	<title>Enterprise Avatar Grabber</title>
</head>

<body>
	<div class="h1">Enterprise Avatar Grabber</div>

	<p class="p">Type in Corporate Email then press GRAB IT!</p>

	<div class="wrapper">
		<input id="textbox" size="30" class="textarea" spellcheck="false" onkeypress="return searchKeyPress(event);">
		<button type="button" id="grabbtn" class="btn" onclick="multiPic()">GRAB IT!</button>
	</div>

	<p></p>

	<div class="wrapper">
		<button type="button" class="btn" onclick="insertText()">Insert Sample</button>
		<button type="button" class="btn" onclick="clearAll()">Clear</button>
		<button type="button" class="btn" onclick="copyUrl()">Copy link</button>
	</div>

	<div id="auth-alert-container"></div>

	<hr width="648px">

	<div class="wrapper" id="multi"></div>

	<div style="height: 30px;">
		<center>
			<p id="loading" style="visibility: hidden;">Loading...</p>
		</center>
	</div>

	<script type='text/javascript'>
		function insertText() {
			document.getElementById("textbox").value = "example.user@cn.bosch.com";
		}

		function showAuthWarning() {
			var container = document.getElementById("auth-alert-container");
			if (!document.getElementById("auth-warning-box")) {
				var warningBox = document.createElement("div");
				warningBox.id = "auth-warning-box";
				warningBox.className = "auth-warning";
				warningBox.innerHTML = '⚠️ <strong>Authentication Required:</strong> To view high-resolution avatars, please open <a href="https://bosch.sharepoint.com" target="_blank">SharePoint</a> in this browser session to sign in, then try grabbing again.';
				container.appendChild(warningBox);
			}
		}

		function removeAuthWarning() {
			var warningBox = document.getElementById("auth-warning-box");
			if (warningBox) {
				warningBox.remove();
			}
		}

		function multiPic() {
			var input = document.getElementById("textbox").value;
			input = emailFormatter(input);
			document.getElementById("textbox").value = input;

			var emails = input.match(/[\.\w\-]*@[\.\w\-]*\.com/gi);
			var src = document.getElementById("multi");

			src.innerHTML = '';
			removeAuthWarning();

			if (!emails || emails.length === 0) {
				alert("Please enter a valid Corporate Email.");
				return;
			}

			document.getElementById('loading').style.visibility = 'visible';

			for (var i = 0; i < emails.length; i++) {
				let email = emails[i].trim();
				if (!email) continue;

				var img = document.createElement("img");

				img.src = "https://bosch.sharepoint.com/_layouts/15/userphoto.aspx?size=L&accountname=" + encodeURIComponent(email);

				img.onload = function () {
					document.getElementById('loading').style.visibility = 'hidden';
				};

				img.onerror = function () {
					this.src = "https://avatars.githubusercontent.com/u/12843654?s=150";
					document.getElementById('loading').style.visibility = 'hidden';
					showAuthWarning();
				};

				src.appendChild(img);
			}

			editUrl(emails);
		}

		function searchKeyPress(e) {
			e = e || window.event;
			if (e.keyCode == 13) {
				document.getElementById('grabbtn').click();
				return false;
			}
			return true;
		}

		window.onload = function () {
			var url = window.location.href;
			url = url.replace(/%40/g, '@');
			url = url.replace(/%2c/g, ',');
			var reg = emailFormatter(url);
			if (reg != '') {
				document.getElementById("textbox").value = reg;
				document.getElementById("textbox").focus();
				multiPic();
			} else {
				editUrl();
			}
		}

		function emailFormatter(input) {
			var reg = input.match(/[\.\w\-]*@[\.\w\-]*\.com/gi);
			var emails = '';
			if (reg != null) {
				for (var i = 0; i < reg.length; i++) {
					emails = emails + reg[i] + ',';
				}
				return emails;
			} else {
				return '';
			}
		}

		function editUrl(email) {
			var regexHtml = new RegExp(/^.*\.html*/, 'i');
			if (email != null) {
				if (history.pushState) {
					window.history.pushState({}, email, '?email=' + email);
				} else {
					var url = window.location.href;
					window.location.href = url.match(regexHtml) + '?email=' + email;
				}
			} else {
				if (history.pushState) {
					var url = window.location.href.match(regexHtml);
					window.history.pushState({}, email, url);
				} else {
					var url = window.location.href;
					window.location.href = url.match(regexHtml);
				}
			}
		}

		function copyUrl() {
			var textArea = document.createElement("textarea");
			// FIXED: Dynamically capture the current host URL instead of hardcoding personal profile links
			var currentUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
			textArea.value = currentUrl + '?email=' + document.getElementById("textbox").value;

			document.body.appendChild(textArea);
			textArea.select();
			document.execCommand("Copy");
			textArea.remove();
		}

		function clearAll() {
			document.getElementById("textbox").value = "";
			document.getElementById("multi").innerHTML = "";
			document.getElementById('loading').style.visibility = 'hidden';
			removeAuthWarning();
			editUrl();
		}
	</script>
	<script>
		if (window.parent && window.parent.parent) {
			window.parent.parent.postMessage(["resultsFrame", {
				height: document.body.getBoundingClientRect().height,
				slug: "gfqegg21"
			}], "\*")
		}
	</script>
</body>

</html>
